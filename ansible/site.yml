---
- name: Preflight - validate storage configuration
  hosts: localhost
  gather_facts: false
  become: false
  tags: [always]
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Check that the selected storage backend is valid
      ansible.builtin.assert:
        that:
          - storage_backend in ['longhorn', 'local-path', 'nfs']
          - storage_backend != 'nfs' or (services_vm_enabled | bool)
        fail_msg: >-
          storage_backend must be longhorn, local-path or nfs, and NFS requires the services VM.
        quiet: true

- name: Group hosts that are enabled in the inventory
  hosts: all
  gather_facts: false
  tags: [always]
  tasks:
    - name: Put disabled services VMs in "disabled", everything else in "active"
      ansible.builtin.group_by:
        key: >-
          {{ 'disabled' if (inventory_hostname in groups['service_nodes'] and not services_vm_enabled | bool)
             or (inventory_hostname in groups['secrets_nodes'] and not secrets_vm_enabled | bool) else 'active' }}
      changed_when: false

# ── Cluster ─────────────────────────────────────────────────
- name: Common Kubernetes prerequisites
  hosts: k8s_cluster
  become: true
  roles:
    - { role: common, tags: ["init", "role_common"] }

- name: Initialize Kubernetes control plane
  hosts: control_nodes
  become: true
  roles:
    - { role: controlplane, tags: ["init", "role_controlplane"] }

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  serial: 1
  roles:
    - { role: worker, tags: ["init", "role_worker"] }

- name: Wait for system pods
  hosts: control_nodes
  become: true
  roles:
    - { role: waiting, tags: ["init", "role_waiting"] }

- name: Install Helm and metrics-server
  hosts: control_nodes
  become: true
  roles:
    - { role: helm, tags: ["helm", "init", "role_helm"] }
    - { role: metrics_server, tags: ["metrics", "init", "role_metrics_server"] }

# ── Secrets VM (outside the cluster) ────────────────────────
- name: OpenBao on the secrets VM (source of truth for every secret)
  hosts: secrets_nodes:&active
  become: true
  roles:
    - { role: openbao_server, tags: ["role_openbao_server"] }

# ── Storage ─────────────────────────────────────────────────
- name: Docker and NFS on the services VM
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: Docker_NFS, tags: ["role_docker_nfs"] }

- name: Cluster storage (Longhorn, local-path or NFS)
  hosts: control_nodes
  become: true
  roles:
    - { role: storage, tags: ["role_storage"] }

# ── Platform: policy first, then secrets ────────────────────
- name: Kyverno policies (enforced before any workload is installed)
  hosts: control_nodes
  become: true
  roles:
    - { role: kyverno, tags: ["role_kyverno"] }

- name: External Secrets (syncs OpenBao secrets into the cluster)
  hosts: control_nodes
  become: true
  roles:
    - { role: external_secrets, tags: ["role_external_secrets"] }

- name: Traefik ingress
  hosts: control_nodes
  become: true
  roles:
    - { role: traefik, tags: ["role_traefik"] }

# ── Applications ────────────────────────────────────────────
- name: Jenkins
  hosts: control_nodes
  become: true
  roles:
    - { role: jenkins, tags: ["role_jenkins"] }

- name: Prometheus
  hosts: control_nodes
  become: true
  roles:
    - { role: prometheus, tags: ["role_prometheus"] }

- name: Grafana
  hosts: control_nodes
  become: true
  roles:
    - { role: grafana, tags: ["role_grafana"] }

- name: MySQL
  hosts: control_nodes
  become: true
  roles:
    - { role: mysql, tags: ["role_mysql"] }

# ── Services VM ─────────────────────────────────────────────
- name: GitLab
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: gitlab, tags: ["role_gitlab"] }

- name: Container insecure registry setup (Docker & CRI-O)
  hosts: all:&active
  become: true
  roles:
    - { role: docker_insecure_registry, tags: ["role_docker_insecure_registry"] }

- name: Nexus
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: nexus, tags: ["role_nexus"] }

- name: Gitea
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: gitea, tags: ["role_gitea"] }

- name: Harbor
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: harbor, tags: ["role_harbor"] }
