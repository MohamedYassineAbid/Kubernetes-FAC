---
- name: Preflight - validate the deploy switches
  hosts: localhost
  gather_facts: false
  become: false
  tags: [always]
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Check that every enabled layer has what it needs
      ansible.builtin.assert:
        that:
          - storage_backend in ['longhorn', 'local-path', 'nfs']
          - storage_backend != 'nfs' or (services_vm_enabled | bool)
          - not (deploy_jenkins | bool) or (deploy_storage | bool and deploy_secrets | bool)
          - not (deploy_monitoring | bool) or (deploy_storage | bool and deploy_secrets | bool)
          - not (deploy_monitoring | bool) or (deploy_traefik | bool)
          - not (deploy_mysql | bool) or (deploy_storage | bool and deploy_secrets | bool)
          - not (deploy_traefik | bool) or (deploy_secrets | bool)
          - not (services_vm_enabled | bool) or (deploy_secrets | bool)
        fail_msg: >-
          A switch in hosts.yml needs another one turned on: jenkins, monitoring and mysql
          need storage, secrets and Traefik; traefik and the services VM need secrets;
          storage_backend must be longhorn, local-path or nfs, and nfs needs services_vm_enabled.
        quiet: true

- name: Group hosts that are enabled in the inventory
  hosts: all
  gather_facts: false
  tags: [always]
  tasks:
    - name: Put disabled services VMs in "disabled", everything else in "active"
      ansible.builtin.group_by:
        key: >-
          {{ 'disabled' if (inventory_hostname in groups['service_nodes'] and not services_vm_enabled | bool)
             or (inventory_hostname in groups['secrets_nodes'] and not deploy_secrets | bool) else 'active' }}
      changed_when: false

# ── Cluster ─────────────────────────────────────────────────
- name: Common Kubernetes prerequisites
  hosts: k8s_cluster
  become: true
  roles:
    - { role: common, tags: ["init", "common"] }

- name: Initialize Kubernetes control plane
  hosts: control_nodes
  become: true
  roles:
    - { role: controlplane, tags: ["init", "controlplane"] }

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  serial: 1
  roles:
    - { role: worker, tags: ["init", "worker"] }

- name: Wait for system pods
  hosts: control_nodes
  become: true
  roles:
    - { role: waiting, tags: ["init", "waiting"] }

- name: Install Helm and metrics-server
  hosts: control_nodes
  become: true
  roles:
    - { role: helm, tags: ["helm", "init"] }
    - { role: metrics_server, tags: ["metrics", "init"] }

# ── Secrets VM (outside the cluster) ────────────────────────
- name: OpenBao on the secrets VM (source of truth for every secret)
  hosts: secrets_nodes:&active
  become: true
  roles:
    - { role: openbao_server, tags: ["openbao_server", "openbao", "secrets", "traefik", "jenkins", "grafana", "mysql", "harbor"] }

# ── Storage ─────────────────────────────────────────────────
- name: Docker and NFS on the services VM
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: Docker_NFS, tags: ["dockernfs"] }

- name: Cluster storage (Longhorn, local-path or NFS)
  hosts: control_nodes
  become: true
  roles:
    - { role: storage, tags: ["storage", "jenkins", "prometheus", "grafana", "mysql"], when: deploy_storage | bool }

# ── Platform: policy first, then secrets ────────────────────
- name: Kyverno policies (enforced before any workload is installed)
  hosts: control_nodes
  become: true
  roles:
    - { role: kyverno, tags: ["kyverno"], when: deploy_kyverno | bool }

- name: External Secrets (syncs OpenBao secrets into the cluster)
  hosts: control_nodes
  become: true
  roles:
    - { role: external_secrets, tags: ["openbao", "secrets", "jenkins", "grafana", "mysql"], when: deploy_secrets | bool }

- name: Traefik ingress
  hosts: control_nodes
  become: true
  roles:
    - { role: traefik, tags: ["traefik"], when: deploy_traefik | bool }

# ── Applications ────────────────────────────────────────────
- name: Jenkins
  hosts: control_nodes
  become: true
  roles:
    - { role: jenkins, tags: ["jenkins"], when: deploy_jenkins | bool }

- name: Prometheus
  hosts: control_nodes
  become: true
  roles:
    - { role: prometheus, tags: ["prometheus"], when: deploy_monitoring | bool }

- name: Grafana
  hosts: control_nodes
  become: true
  roles:
    - { role: grafana, tags: ["grafana"], when: deploy_monitoring | bool }

- name: MySQL
  hosts: control_nodes
  become: true
  roles:
    - { role: mysql, tags: ["mysql"], when: deploy_mysql | bool }

# ── Services VM ─────────────────────────────────────────────
- name: GitLab
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: gitlab, tags: ["gitlab"] }

- name: Container insecure registry setup (Docker & CRI-O)
  hosts: all:&active
  become: true
  roles:
    - { role: docker_insecure_registry, tags: ["insecure", "nexus"], when: services_vm_enabled | bool }

- name: Nexus
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: nexus, tags: ["nexus"] }

- name: Gitea
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: gitea, tags: ["gitea"] }

- name: Harbor
  hosts: service_nodes:&active
  become: true
  roles:
    - { role: harbor, tags: ["harbor"] }
