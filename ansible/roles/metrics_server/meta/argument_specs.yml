---
# Validated automatically before the role runs: a missing or mistyped
# variable fails here instead of half-way through a deployment.
argument_specs:
  main:
    short_description: metrics-server from the official chart
    options:
      metrics_server_chart_version:
        type: str
        required: true
        description: Chart version
      metrics_server_namespace:
        type: str
        required: true
        description: Namespace
      metrics_server_kubelet_insecure_tls:
        type: bool
        required: true
        description: Skip kubelet cert verification (self-signed kubelet certs)
      kubeconfig_path:
        type: str
        required: true
        description: admin kubeconfig path
