---
# Validated automatically before the role runs: a missing or mistyped
# variable fails here instead of half-way through a deployment.
argument_specs:
  main:
    short_description: 'Kubernetes node prerequisites: kernel, sysctls, CRI-O, kubeadm/kubelet/kubectl'
    options:
      internal_ip:
        type: str
        required: true
        description: Node IP on the private network
      dns_servers:
        type: list
        required: true
        description: Upstream DNS servers
      kubernetes_version:
        type: str
        required: true
        description: apt version pattern, e.g. 1.36.6-*
      kubernetes_version_short:
        type: str
        required: true
        description: Minor version, e.g. 1.36
      storage_backend:
        type: str
        required: true
        choices:
        - longhorn
        - local-path
        - nfs
        description: Storage backend
