---
# ── kubeadm init ─────────────────────────────────────────────
- name: Install Python kubernetes library (needed by kubernetes.core modules)
  apt:
    name: python3-kubernetes
    state: present

- name: Check if cluster is already initialized
  stat:
    path: "{{ kubeconfig_path }}"
  register: kubeadm_init_check

# ── Hardening inputs that must exist before the API server starts ──
- name: Create encryption-at-rest and audit directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/kubernetes/encryption
    - /etc/kubernetes/audit
    - /var/log/kubernetes/audit

- name: Check for an existing etcd encryption config
  stat:
    path: /etc/kubernetes/encryption/config.yaml
  register: encryption_config

- name: Check for a host-side etcd encryption key backup
  stat:
    path: "{{ playbook_dir }}/fetched/kubernetes/etcd-encryption-key.b64"
  register: etcd_encryption_key_backup
  delegate_to: localhost
  become: false

- name: Read the host-side etcd encryption key for a rebuilt control plane
  slurp:
    src: "{{ playbook_dir }}/fetched/kubernetes/etcd-encryption-key.b64"
  register: etcd_encryption_key_backup_raw
  delegate_to: localhost
  become: false
  no_log: true
  when: not encryption_config.stat.exists and etcd_encryption_key_backup.stat.exists

- name: Reuse the backed-up etcd encryption key
  set_fact:
    etcd_encryption_key_value: "{{ etcd_encryption_key_backup_raw.content | b64decode | trim }}"
  no_log: true
  when: not encryption_config.stat.exists and etcd_encryption_key_backup.stat.exists

# The key is generated on the control plane and only copied to a protected local backup.
# Never regenerate it for an existing etcd data set: encrypted Secrets would become unreadable.
- name: Generate etcd encryption key
  shell: set -o pipefail && head -c 32 /dev/urandom | base64 -w0
  args:
    executable: /bin/bash
  register: etcd_encryption_key_generated
  changed_when: true
  no_log: true
  when: not encryption_config.stat.exists and not etcd_encryption_key_backup.stat.exists

- name: Set the generated etcd encryption key
  set_fact:
    etcd_encryption_key_value: "{{ etcd_encryption_key_generated.stdout }}"
  no_log: true
  when: not encryption_config.stat.exists and not etcd_encryption_key_backup.stat.exists

- name: Write etcd encryption config
  template:
    src: encryption-config.yaml.j2
    dest: /etc/kubernetes/encryption/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not encryption_config.stat.exists

# Keep a protected host-side copy with the fetched kubeconfig. An etcd snapshot
# cannot be restored without this key. The remote config remains the source of
# truth so this also repairs a missing local backup on later playbook runs.
- name: Read the active etcd encryption configuration
  slurp:
    src: /etc/kubernetes/encryption/config.yaml
  register: etcd_encryption_config_raw
  no_log: true

- name: Create local Kubernetes recovery directory
  file:
    path: "{{ playbook_dir }}/fetched/kubernetes"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Back up the active etcd encryption key locally
  copy:
    dest: "{{ playbook_dir }}/fetched/kubernetes/etcd-encryption-key.b64"
    content: "{{ (etcd_encryption_config_raw.content | b64decode | from_yaml).resources[0].providers[0].secret }}\n"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

- name: Write API server audit policy
  template:
    src: audit-policy.yaml.j2
    dest: /etc/kubernetes/audit/policy.yaml
    owner: root
    group: root
    mode: "0600"

- name: Read installed kubeadm version
  command: kubeadm version -o short
  register: kubeadm_version_out
  changed_when: false

- name: Render kubeadm config
  template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Pull kubeadm images
  command: kubeadm config images pull --config /etc/kubernetes/kubeadm-config.yaml
  when: not kubeadm_init_check.stat.exists

- name: Initialize the Kubernetes cluster
  command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when: not kubeadm_init_check.stat.exists

# ── kubeconfig for root and {{ ansible_user }} (cluster-admin: owner-only) ──
- name: Create .kube directories
  file:
    path: "{{ item.home }}/.kube"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0700"
  loop:
    - { user: root, home: /root }
    - { user: "{{ ansible_user }}", home: "/home/{{ ansible_user }}" }

- name: Install admin kubeconfig
  copy:
    src: "{{ kubeconfig_path }}"
    dest: "{{ item.home }}/.kube/config"
    remote_src: true
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0600"
  loop:
    - { user: root, home: /root }
    - { user: "{{ ansible_user }}", home: "/home/{{ ansible_user }}" }

# ── Ensure Calico CNI directory ──────────────────────────────
- name: Create Calico CNI directory
  file:
    path: /var/lib/calico
    state: directory
    mode: "0755"

# ── Install Calico ───────────────────────────────────────────
- name: Download Calico manifest
  get_url:
    url: "https://raw.githubusercontent.com/projectcalico/calico/v{{ calico_version }}/manifests/calico.yaml"
    dest: "/root/calico-v{{ calico_version }}.yaml"
    mode: "0644"

- name: Apply Calico manifest
  command: kubectl apply -f /root/calico-v{{ calico_version }}.yaml --kubeconfig={{ kubeconfig_path }}
  register: calico_result
  changed_when: "'created' in calico_result.stdout or 'configured' in calico_result.stdout"

# Short-lived token: only needs to outlive the worker play that follows
- name: Generate kubeadm join command
  command: kubeadm token create --print-join-command --ttl 30m
  register: join_command_output
  changed_when: false
  no_log: true

- name: Store join command as fact
  set_fact:
    kubeadm_join_command: "{{ join_command_output.stdout }}"
  no_log: true

# Local copy for running kubectl from the host. ansible/fetched/ is git-ignored;
# never commit it — it is a cluster-admin credential.
- name: Fetch admin.conf to local machine
  fetch:
    src: "{{ kubeconfig_path }}"
    dest: "{{ playbook_dir }}/fetched/admin.conf"
    flat: true

- name: Restrict local admin.conf to the current user
  file:
    path: "{{ playbook_dir }}/fetched/admin.conf"
    mode: "0600"
  delegate_to: localhost
  become: false
