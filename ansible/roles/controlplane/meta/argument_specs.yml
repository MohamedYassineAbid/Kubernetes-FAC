---
# Validated automatically before the role runs: a missing or mistyped
# variable fails here instead of half-way through a deployment.
argument_specs:
  main:
    short_description: kubeadm init with etcd encryption, audit logging and hardened kubelet
    options:
      internal_ip:
        type: str
        required: true
        description: API server advertise address
      pod_cidr:
        type: str
        required: true
        description: Pod network CIDR
      service_cidr:
        type: str
        required: true
        description: Service CIDR
      calico_version:
        type: str
        required: true
        description: Calico manifest version
      kubeconfig_path:
        type: str
        required: true
        description: admin kubeconfig path
      ansible_user:
        type: str
        required: true
        description: Login user
