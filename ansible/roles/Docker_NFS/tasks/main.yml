---
- name: Install required packages
  apt:
    name:
      - git
      - curl
      - wget
      - gnupg2
      - nfs-kernel-server
      - docker.io
      - ufw
      - ca-certificates
      - apt-transport-https
    state: present
    update_cache: true

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Create docker group
  group:
    name: docker
    state: present

- name: Add {{ ansible_user }} user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# Only the provisioner (root, via no_root_squash) creates per-PVC subdirectories,
# so the export root needs no world-write bits.
- name: Create NFS export directory
  file:
    path: "{{ nfs_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Exported to the Kubernetes nodes' IPs only, not the whole host-only subnet.
# no_root_squash stays: images such as MySQL, Grafana and Jenkins chown their data
# directory at start-up, which fails under root_squash. Inline `nfs:` pod volumes
# (which would mount the whole export) are blocked by the Kyverno
# disallow-nfs-volumes policy instead.
- name: Configure NFS exports
  lineinfile:
    path: /etc/exports
    regexp: '^{{ nfs_path }}\s'
    line: >-
      {{ nfs_path }}
      {% for ip in nfs_export_clients %}{{ ip }}(rw,sync,no_subtree_check,no_root_squash){{ ' ' if not loop.last else '' }}{% endfor %}
    state: present
  notify: reload nfs exports

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker apt repository
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_lsb.codename }}"
    components: stable
    architectures: "{{ ansible_architecture | replace('x86_64', 'amd64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Compose plugin
  apt:
    name:
      - docker-compose-plugin
      - docker-buildx-plugin
    state: present
    update_cache: true

- name: Verify Docker Compose version
  command: docker compose version
  register: compose_version
  changed_when: false

- name: Show Docker Compose version
  debug:
    msg: "{{ compose_version.stdout }}"