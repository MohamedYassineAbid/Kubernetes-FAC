---
- name: Create MySQL and application namespaces
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item.name }}"
        labels: { app: "{{ item.app }}", team: devops }
  loop:
    - { name: "{{ mysql_namespace }}", app: mysql }
    - { name: "{{ app_namespace }}", app: "{{ app_namespace }}" }

# Passwords come from OpenBao (apps/mysql); user/database names from group_vars
- name: Sync MySQL server credentials from OpenBao
  ansible.builtin.include_role:
    name: external_secrets
    tasks_from: sync
  vars:
    es_name: "{{ mysql_secret_name }}"
    es_namespace: "{{ mysql_namespace }}"
    es_path: apps/mysql
    es_properties: { root-password: root-password, password: password }
    es_static: { user: "{{ mysql_user }}", database: "{{ mysql_database }}" }

- name: Sync application database credentials from OpenBao
  ansible.builtin.include_role:
    name: external_secrets
    tasks_from: sync
  vars:
    es_name: "{{ streamlit_mysql_secret_name }}"
    es_namespace: "{{ app_namespace }}"
    es_path: apps/mysql
    es_properties: { password: password }
    es_static: { user: "{{ mysql_user }}", database: "{{ mysql_database }}" }

- name: Apply MySQL manifest
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: "{{ lookup('template', 'mysql.yaml.j2') | from_yaml_all | select | list }}"

- name: Wait for MySQL to be ready
  ansible.builtin.command: >
    kubectl --kubeconfig={{ kubeconfig_path }}
    rollout status statefulset/mysql
    --namespace={{ mysql_namespace }}
    --timeout={{ mysql_rollout_timeout }}
  changed_when: false

- name: Print MySQL access info
  ansible.builtin.debug:
    msg:
      - "MySQL host (in-cluster): mysql.{{ mysql_namespace }}.svc.cluster.local:3306"
      - "Database : {{ mysql_database }}"
      - "User     : {{ mysql_user }}"
      - "Passwords: OpenBao {{ openbao_kv_mount }}/apps/mysql"
