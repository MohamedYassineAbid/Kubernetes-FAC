---
- name: Render MySQL manifest
  ansible.builtin.template:
    src: mysql.yaml.j2
    dest: /tmp/mysql.yaml
    mode: "0644"

- name: Create Streamlit MySQL secret
  ansible.builtin.shell: >
    kubectl --kubeconfig={{ kubeconfig_path }}
    create secret generic {{ streamlit_mysql_secret_name }}
    --namespace={{ app_namespace }}
    --from-literal=user={{ mysql.user }}
    --from-literal=password={{ mysql.password }}
    --from-literal=database={{ mysql.database }}
    --dry-run=client -o yaml | kubectl --kubeconfig={{ kubeconfig_path }} apply -f -
  args:
    executable: /bin/bash
  no_log: true

- name: Apply MySQL manifest
  ansible.builtin.command: >
    kubectl --kubeconfig={{ kubeconfig_path }} apply -f /tmp/mysql.yaml
  register: mysql_apply
  changed_when: "'created' in mysql_apply.stdout or 'configured' in mysql_apply.stdout"

- name: Wait for MySQL to be ready
  ansible.builtin.command: >
    kubectl --kubeconfig={{ kubeconfig_path }}
    rollout status statefulset/mysql
    --namespace={{ mysql.namespace }}
    --timeout=180s
  changed_when: false

- name: Print MySQL access info
  ansible.builtin.debug:
    msg:
      - "MySQL host (in-cluster): mysql.{{ mysql.namespace }}.svc.cluster.local:3306"
      - "Database : {{ mysql.database }}"
      - "User     : {{ mysql.user }}"