---
- name: Add Prometheus community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Deploy Prometheus with Traefik Ingress
  kubernetes.core.helm:
    name: "{{ prometheus_release }}"
    chart_ref: prometheus-community/prometheus
    chart_version: "{{ prometheus_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path }}"
    update_repo_cache: true
    wait: true
    values:
      server:
        persistentVolume:
          enabled: true
          size: "{{ prometheus_storage_size }}"
          storageClass: "{{ storage_class_name }}"
        ingress:
          enabled: true
          ingressClassName: "{{ traefik_ingress_class }}"
          hosts:
            - "{{ prometheus_host }}"
      alertmanager:
        enabled: "{{ prometheus_alertmanager_enabled }}"
