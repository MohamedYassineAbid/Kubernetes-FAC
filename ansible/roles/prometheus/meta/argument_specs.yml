---
# Validated automatically before the role runs: a missing or mistyped
# variable fails here instead of half-way through a deployment.
argument_specs:
  main:
    short_description: Prometheus server
    options:
      prometheus_chart_version:
        type: str
        required: true
        description: Chart version
      prometheus_release:
        type: str
        required: true
        description: Release name
      monitoring_namespace:
        type: str
        required: true
        description: Namespace
      prometheus_storage_size:
        type: str
        required: true
        description: PVC size
      prometheus_alertmanager_enabled:
        type: bool
        required: true
        description: Deploy Alertmanager
      prometheus_ingress_enabled:
        type: bool
        required: true
        description: Create an Ingress (requires a matching ingress controller to serve traffic)
      prometheus_host:
        type: str
        required: true
        description: Ingress host
      traefik_ingress_class:
        type: str
        required: true
        description: IngressClass
      storage_class_name:
        type: str
        required: true
        description: StorageClass
      kubeconfig_path:
        type: str
        required: true
        description: admin kubeconfig path
