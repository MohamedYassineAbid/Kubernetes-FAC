---
- name: Validate Traefik NodePort values
  ansible.builtin.assert:
    that:
      - not traefik_nodeport_http_enabled or (traefik_nodeport_http | int >= 30000 and traefik_nodeport_http | int <= 32767)
      - not traefik_nodeport_https_enabled or (traefik_nodeport_https | int >= 30000 and traefik_nodeport_https | int <= 32767)
    fail_msg: "Traefik NodePort must be between 30000 and 32767"
  tags: [setup, ingress]

- name: Check kubeconfig presence
  ansible.builtin.stat:
    path: "{{ kubeconfig_path }}"
  register: kubeconfig_stat
  tags: [setup, ingress]

- name: Ensure kubeconfig exists before applying Traefik
  ansible.builtin.assert:
    that:
      - kubeconfig_stat.stat.exists
    fail_msg: "kubeconfig not found at {{ kubeconfig_path }}"
  tags: [setup, ingress]

- name: Read the dashboard password from OpenBao
  ansible.builtin.include_role:
    name: openbao_server
    tasks_from: read
  vars:
    ob_path: bootstrap/traefik
    ob_field: dashboard-password
    ob_fact: traefik_dashboard_password
  when: traefik_dashboard_enabled | bool
  tags: [setup, ingress]

- name: Require a dashboard password when the dashboard is enabled
  ansible.builtin.assert:
    that:
      - traefik_dashboard_password | length >= 12
    fail_msg: >-
      The Traefik dashboard password read from OpenBao (kv/bootstrap/traefik) is missing
      or shorter than 12 characters. Run the OpenBao role first, or set
      traefik_dashboard_enabled: false.
    quiet: true
  when: traefik_dashboard_enabled | bool
  tags: [setup, ingress]

- name: Apply Traefik manifest
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: "{{ lookup('template', 'traefik.yaml.j2') | from_yaml_all | select | list }}"
  no_log: true
  tags: [setup, ingress]

- name: Wait for Traefik deployment rollout
  ansible.builtin.command: >
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ traefik_namespace }}
    rollout status deployment/{{ traefik_service_name }} --timeout={{ traefik_rollout_timeout }}
  register: traefik_rollout
  changed_when: false
  tags: [setup, ingress]
