---
- name: Read the Harbor admin password from OpenBao
  ansible.builtin.include_role:
    name: openbao_server
    tasks_from: read
  vars:
    ob_path: bootstrap/harbor
    ob_field: admin-password
    ob_fact: harbor_admin_password

- name: Download Harbor online installer
  get_url:
    url: "https://github.com/goharbor/harbor/releases/download/{{ harbor_version }}/harbor-online-installer-{{ harbor_version }}.tgz"
    dest: "/tmp/harbor-online-installer-{{ harbor_version }}.tgz"
    checksum: "sha256:{{ harbor_installer_sha256 }}"
    mode: '0644'

- name: Extract Harbor archive
  unarchive:
    src: "/tmp/harbor-online-installer-{{ harbor_version }}.tgz"
    dest: "{{ harbor_install_dir | dirname }}"
    remote_src: yes
    creates: "{{ harbor_install_dir }}/install.sh"

# force: false -> seed harbor.yml once; the edits below then converge it
- name: Create harbor.yml from template (first run only)
  copy:
    src: "{{ harbor_install_dir }}/harbor.yml.tmpl"
    dest: "{{ harbor_install_dir }}/harbor.yml"
    remote_src: yes
    force: false
    mode: "0600"
  register: harbor_cfg_seed

- name: Configure harbor.yml
  replace:
    path: "{{ harbor_install_dir }}/harbor.yml"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - { regexp: '^hostname: .*', replace: "hostname: {{ harbor_hostname }}" }
    - { regexp: '^(\s*)port: 80$', replace: '\1port: {{ harbor_http_port }}' }
    - { regexp: '^data_volume: .*', replace: "data_volume: {{ harbor_data_volume }}" }
    # HTTPS block disabled (no certificates provisioned yet)
    - { regexp: '^(https:.*)$', replace: '#\1' }
    - { regexp: '^(\s*port: 443.*)$', replace: '#\1' }
    - { regexp: '^(\s*certificate: .*)$', replace: '#\1' }
    - { regexp: '^(\s*private_key: .*)$', replace: '#\1' }
  loop_control:
    label: "{{ item.regexp }}"
  register: harbor_cfg_edits

- name: Set admin password
  replace:
    path: "{{ harbor_install_dir }}/harbor.yml"
    regexp: '^harbor_admin_password: .*'
    replace: "harbor_admin_password: {{ harbor_admin_password }}"
  register: harbor_cfg_password
  no_log: true

- name: Check whether Harbor is running
  command: docker compose ps --status running --quiet
  args:
    chdir: "{{ harbor_install_dir }}"
  register: harbor_running
  changed_when: false
  failed_when: false

# install.sh regenerates the compose project and starts it
- name: Run Harbor install script
  command: ./install.sh
  args:
    chdir: "{{ harbor_install_dir }}"
  register: install_output
  when: >-
    harbor_cfg_seed.changed or harbor_cfg_edits.changed or harbor_cfg_password.changed
    or harbor_running.rc != 0 or (harbor_running.stdout | trim | length == 0)

- name: Show install output
  debug:
    var: install_output.stdout_lines
  when: install_output is not skipped

- name: Wait for Harbor to be ready
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/ping"
    status_code: 200
  register: harbor_ping
  retries: 10
  delay: 15
  until: harbor_ping.status == 200

- name: Harbor is ready
  debug:
    msg: "Harbor is up and running at http://{{ harbor_url }}"
