---
# Validated automatically before the role runs: a missing or mistyped
# variable fails here instead of half-way through a deployment.
argument_specs:
  main:
    short_description: Gitea on the services VM
    options:
      gitea_image:
        type: str
        required: true
        description: Image
      gitea_data_path:
        type: str
        required: true
        description: Data path
      gitea_http_port:
        type: int
        required: true
        description: HTTP port
      gitea_ssh_port:
        type: int
        required: true
        description: SSH port
      gitea_uid:
        type: int
        required: true
        description: Image UID
