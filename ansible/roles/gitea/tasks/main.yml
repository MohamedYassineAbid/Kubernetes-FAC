---
- name: Ensure Python Docker library is installed
  apt:
    name: python3-docker
    state: present
    update_cache: yes

- name: Create directory on the NFS path for persistent data
  file:
    path: "{{ gitea_data_path }}"
    state: directory
    owner: "{{ gitea_uid }}"
    group: "{{ gitea_uid }}"
    mode: "0755"

- name: Deploy Gitea as a Docker container
  community.docker.docker_container:
    name: gitea
    image: "{{ gitea_image }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ gitea_http_port }}:3000"
      - "{{ gitea_ssh_port }}:22"
    volumes:
      - "{{ gitea_data_path }}:/data"
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    env:
      USER_UID: "{{ gitea_uid }}"
      USER_GID: "{{ gitea_uid }}"
