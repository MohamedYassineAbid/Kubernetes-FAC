---
- name: Set package facts
  ansible.builtin.set_fact:
    openbao_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Download OpenBao {{ openbao_version }} (checksum-verified)
  ansible.builtin.get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_{{ openbao_arch }}.deb"
    dest: "/tmp/openbao_{{ openbao_version }}_{{ openbao_arch }}.deb"
    checksum: "sha256:{{ openbao_deb_sha256[openbao_arch] }}"
    mode: "0644"

- name: Install OpenBao package
  ansible.builtin.apt:
    deb: "/tmp/openbao_{{ openbao_version }}_{{ openbao_arch }}.deb"

- name: Locate the bao binary
  ansible.builtin.command: bash -c 'command -v bao'
  register: openbao_bin
  changed_when: false

- name: Ensure the openbao service user exists
  ansible.builtin.user:
    name: openbao
    system: true
    shell: /usr/sbin/nologin
    home: "{{ openbao_data_dir | dirname }}"
    create_home: false

- name: Create OpenBao directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: openbao
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openbao_config_dir }}", owner: root, mode: "0750" }
    - { path: "{{ openbao_tls_dir }}", owner: root, mode: "0750" }
    - { path: "{{ openbao_data_dir | dirname }}", owner: openbao, mode: "0750" }
    - { path: "{{ openbao_data_dir }}", owner: openbao, mode: "0700" }
    - { path: "{{ openbao_log_dir }}", owner: openbao, mode: "0750" }
    - { path: "{{ openbao_init_file | dirname }}", owner: root, mode: "0700" }

- name: Install TLS certificate, key and CA
  ansible.builtin.copy:
    src: "{{ openbao_pki_dir }}/{{ item.src }}"
    dest: "{{ openbao_tls_dir }}/{{ item.dest }}"
    owner: root
    group: openbao
    mode: "{{ item.mode }}"
  loop:
    - { src: openbao.crt, dest: server.crt, mode: "0644" }
    - { src: openbao.key, dest: server.key, mode: "0640" }
    - { src: ca.crt, dest: ca.crt, mode: "0644" }
  notify: restart openbao

# Losing this key loses every secret: it is backed up to the Ansible host below.
- name: Check for the unseal key
  ansible.builtin.stat:
    path: "{{ openbao_config_dir }}/unseal.key"
  register: openbao_unseal_key

- name: Generate the 32-byte unseal key (first run only)
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    head -c 32 /dev/urandom > {{ openbao_config_dir }}/unseal.key
  args:
    executable: /bin/bash
  when: not openbao_unseal_key.stat.exists
  changed_when: true

- name: Restrict the unseal key to the openbao user
  ansible.builtin.file:
    path: "{{ openbao_config_dir }}/unseal.key"
    owner: openbao
    group: openbao
    mode: "0400"

- name: Read the unseal key for backup
  ansible.builtin.slurp:
    src: "{{ openbao_config_dir }}/unseal.key"
  register: openbao_unseal_key_content
  no_log: true

- name: Create local break-glass directory
  ansible.builtin.file:
    path: "{{ openbao_local_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Back up the unseal key to the Ansible host (0600, git-ignored)
  ansible.builtin.copy:
    dest: "{{ openbao_local_dir }}/unseal-key.b64"
    content: "{{ openbao_unseal_key_content.content }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

- name: Write OpenBao configuration
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_dir }}/openbao.hcl"
    owner: root
    group: openbao
    mode: "0640"
  notify: restart openbao

- name: Install systemd unit
  ansible.builtin.template:
    src: openbao.service.j2
    dest: /etc/systemd/system/openbao.service
    mode: "0644"
  notify: restart openbao

- name: Rotate the audit log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/openbao
    mode: "0644"
    content: |
      {{ openbao_log_dir }}/audit.log {
          daily
          rotate 14
          compress
          missingok
          notifempty
          postrotate
              systemctl kill -s HUP openbao >/dev/null 2>&1 || true
          endscript
      }

# Only SSH and the OpenBao API (from the private network) are reachable
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow the OpenBao API from the private network
  community.general.ufw:
    rule: allow
    port: "{{ openbao_api_port | string }}"
    proto: tcp
    from_ip: "{{ private_network_cidr }}"

- name: Enable the firewall (deny everything else inbound)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Start OpenBao
  ansible.builtin.systemd:
    name: openbao
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts now
  ansible.builtin.meta: flush_handlers
