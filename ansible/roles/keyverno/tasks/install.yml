---
- name: Ensure Python kubernetes library is installed
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present
    update_cache: yes

- name: Add Kyverno Helm repo
  kubernetes.core.helm_repository:
    name: kyverno
    repo_url: "https://kyverno.github.io/kyverno/"

- name: Install Kyverno via Helm
  kubernetes.core.helm:
    name: kyverno
    chart_ref: kyverno/kyverno
    chart_version: "{{ kyverno_chart_version }}"
    release_namespace: "{{ kyverno_namespace }}"
    create_namespace: true
    wait: true
    values:
      cleanupJobs:
        admissionReports:
          image:
            registry: docker.io
            repository: alpine/k8s
            tag: "{{ kyverno_kubectl_image_tag | default('1.28.15') }}"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
        clusterAdmissionReports:
          image:
            registry: docker.io
            repository: alpine/k8s
            tag: "{{ kyverno_kubectl_image_tag | default('1.28.15') }}"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
      cleanupController:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
      admissionController:
        replicas: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 512Mi
      backgroundController:
        replicas: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 512Mi
      reportsController:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 512Mi

- name: Wait for Kyverno to be ready
  ansible.builtin.command: >
    kubectl wait pod
    --for=condition=Ready
    --selector=app.kubernetes.io/part-of=kyverno
    --namespace={{ kyverno_namespace }}
    --timeout=120s
  changed_when: false