---
- name: Apply disallow-latest-tag policy
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'policies/disallow-latest-tag.yml.j2') }}"
  when: kyverno_policies.disallow_latest_tag | default(false)

- name: Apply require-namespace-labels policy
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'policies/require-labels.yml.j2') }}"
  when: kyverno_policies.require_labels | default(false)

- name: Apply require-resource-limits policy
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'policies/require-resource-limits.yml.j2') }}"
  when: kyverno_policies.require_resource_limits | default(false)

- name: Apply disallow-privileged policy
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'policies/disallow-privileged.yml.j2') }}"
  when: kyverno_policies.disallow_privileged | default(false)

- name: Apply disallow-default-namespace policy
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'policies/disallow-default-namespace.yml.j2') }}"
  when: kyverno_policies.disallow_default_namespace | default(false)