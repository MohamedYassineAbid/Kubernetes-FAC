---
# Validated automatically before the role runs: a missing or mistyped
# variable fails here instead of half-way through a deployment.
argument_specs:
  main:
    short_description: Kyverno and the cluster policies
    options:
      kyverno_chart_version:
        type: str
        required: true
        description: Chart version
      kyverno_namespace:
        type: str
        required: true
        description: Namespace
      kyverno_validation_failure_action:
        type: str
        required: true
        description: Enforce or Audit
      kyverno_excluded_namespaces:
        type: list
        required: true
        description: Namespaces exempt from policies
      kyverno_required_labels:
        type: list
        required: true
        description: Labels required on namespaces
      kyverno_policies:
        type: dict
        required: true
        description: Policy on/off switches
      kyverno_admission_replicas:
        type: int
        required: true
        description: Admission controller replicas
      kyverno_background_replicas:
        type: int
        required: true
        description: Background controller replicas
      kyverno_controller_resources:
        type: dict
        required: true
        description: Controller resources
      kyverno_cleanup_resources:
        type: dict
        required: true
        description: Cleanup controller resources
      kubeconfig_path:
        type: str
        required: true
        description: admin kubeconfig path
