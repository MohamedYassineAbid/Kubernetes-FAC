---
- name: Ensure Python kubernetes library is installed
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present
    update_cache: yes

- name: Add Kyverno Helm repo
  kubernetes.core.helm_repository:
    name: kyverno
    repo_url: "https://kyverno.github.io/kyverno/"

- name: Install Kyverno via Helm
  kubernetes.core.helm:
    name: kyverno
    chart_ref: kyverno/kyverno
    chart_version: "{{ kyverno_chart_version }}"
    release_namespace: "{{ kyverno_namespace }}"
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig_path }}"
    update_repo_cache: true
    values:
      cleanupController:
        resources: "{{ kyverno_cleanup_resources }}"
      admissionController:
        replicas: "{{ kyverno_admission_replicas }}"
        # admissionController resources live under .container in chart 3.x
        container:
          resources: "{{ kyverno_controller_resources }}"
      backgroundController:
        replicas: "{{ kyverno_background_replicas }}"
        resources: "{{ kyverno_controller_resources }}"
      reportsController:
        resources: "{{ kyverno_controller_resources }}"

- name: Wait for Kyverno to be ready
  ansible.builtin.command: >
    kubectl wait pod
    --for=condition=Ready
    --selector=app.kubernetes.io/part-of=kyverno
    --namespace={{ kyverno_namespace }}
    --timeout=120s
    --kubeconfig={{ kubeconfig_path }}
  changed_when: false