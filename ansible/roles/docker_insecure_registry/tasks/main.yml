---
- name: Check if Docker is installed
  stat:
    path: /usr/bin/docker
  register: docker_bin

- name: Ensure /etc/docker directory exists
  file:
    path: /etc/docker
    state: directory
  when: docker_bin.stat.exists

- name: Configure insecure registry for Docker
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "insecure-registries": ["{{ nexus_ip }}:{{ nexus_registry_port }}"]
      }
  when: docker_bin.stat.exists
  notify: restart docker

- name: Check if CRI-O is installed
  stat:
    path: /usr/bin/crio
  register: crio_bin

- name: Ensure /etc/containers/registries.conf.d/ directory exists (for CRI-O)
  file:
    path: /etc/containers/registries.conf.d/
    state: directory
    mode: "0755"
  when: crio_bin.stat.exists

- name: Configure insecure registry for CRI-O
  copy:
    dest: /etc/containers/registries.conf.d/99-nexus-insecure.conf
    content: |
      [[registry]]
      location = "{{ nexus_ip }}:{{ nexus_registry_port }}"
      insecure = true
  when: crio_bin.stat.exists
  notify: restart crio

- name: Force run handlers to restart Container Runtimes immediately
  meta: flush_handlers
