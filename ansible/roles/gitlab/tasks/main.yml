# docker_compose_v2 drives the Docker CLI's compose plugin (installed by Docker_NFS).
# The legacy pip installs (pip self-upgrade, docker-compose 1.x, pinned requests)
# re-ran on every play and are not needed; the SDK comes from apt like nexus/gitea.
- name: Ensure Python Docker library is installed
  apt:
    name: python3-docker
    state: present

# Create GitLab data directories
- name: Create GitLab data directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ gitlab_data_dir }}"
    - "{{ gitlab_data_dir }}/config"
    - "{{ gitlab_data_dir }}/logs"
    - "{{ gitlab_data_dir }}/data"
    - "{{ gitlab_compose_dir }}"

# Template docker-compose
- name: Copy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ gitlab_compose_dir }}/docker-compose.yml"
    mode: "0644"

# Start GitLab
- name: Start GitLab container
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_compose_dir }}"
    state: present