---
# Node prerequisites (open-iscsi, iscsid, multipath blacklist) are set by the common role.
- name: Add Longhorn Helm repo
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io

- name: Deploy Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_chart_version }}"
    release_namespace: "{{ longhorn_namespace }}"
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path }}"
    update_repo_cache: true
    wait: true
    wait_timeout: "{{ longhorn_install_timeout }}"
    values:
      persistence:
        defaultClass: true
        defaultClassReplicaCount: "{{ longhorn_replica_count }}"
        reclaimPolicy: Delete
      defaultSettings:
        defaultDataPath: "{{ longhorn_data_path }}"
        storageReservedPercentageForDefaultDisk: "{{ longhorn_reserved_percentage }}"
      csi:
        attacherReplicaCount: "{{ longhorn_csi_replicas }}"
        provisionerReplicaCount: "{{ longhorn_csi_replicas }}"
        resizerReplicaCount: "{{ longhorn_csi_replicas }}"
        snapshotterReplicaCount: "{{ longhorn_csi_replicas }}"
      longhornUI:
        replicas: "{{ longhorn_ui_replicas }}"
