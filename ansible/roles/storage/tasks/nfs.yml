---
# NFS share on the services VM (storage_backend: nfs; needs services_vm_enabled)
- name: Add NFS provisioner Helm repo
  kubernetes.core.helm_repository:
    name: nfs-subdir-external-provisioner
    repo_url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner

- name: Deploy NFS provisioner
  kubernetes.core.helm:
    name: nfs-provisioner
    chart_ref: nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
    chart_version: "{{ nfs_provisioner_chart_version }}"
    release_namespace: "{{ storage_namespace }}"
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path }}"
    update_repo_cache: true
    wait: true
    wait_timeout: "{{ storage_rollout_timeout }}"
    values:
      nfs:
        server: "{{ nfs_server }}"
        path: "{{ nfs_path }}"
      storageClass:
        name: "{{ storage_class_name }}"
        defaultClass: true
        # NFSv4.1: built-in locking (no `nolock`), single TCP port
        mountOptions: "{{ storage_nfs_mount_options }}"
