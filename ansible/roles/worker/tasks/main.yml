---
- name: Check if node is already part of a cluster
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join the Kubernetes cluster
  command: "{{ hostvars[control_plane_host]['kubeadm_join_command'] }} --node-name {{ inventory_hostname }}"
  when: not kubelet_conf.stat.exists
  no_log: true

# Workers deliberately get NO admin kubeconfig: a compromised worker must not
# mean a compromised cluster. Use kubectl from the control plane or the host.
- name: Remove any admin kubeconfig left by older versions of this playbook
  file:
    path: /home/{{ ansible_user }}/.kube/config
    state: absent

- name: Label node as worker
  command: kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/worker=worker --overwrite --kubeconfig={{ kubeconfig_path }}
  delegate_to: "{{ control_plane_host }}"
  register: label_result
  changed_when: "'not labeled' not in label_result.stdout"
