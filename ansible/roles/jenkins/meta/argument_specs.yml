---
# Validated automatically before the role runs: a missing or mistyped
# variable fails here instead of half-way through a deployment.
argument_specs:
  main:
    short_description: Jenkins (admin credentials from OpenBao)
    options:
      jenkins_chart_version:
        type: str
        required: true
        description: Chart version
      jenkins_namespace:
        type: str
        required: true
        description: Namespace
      jenkins_node_port:
        type: int
        required: true
        description: NodePort
      jenkins_storage_size:
        type: str
        required: true
        description: PVC size
      jenkins_wait_timeout:
        type: str
        required: true
        description: Helm wait timeout
      jenkins_admin_user:
        type: str
        required: true
        description: Admin user
      jenkins_admin_secret_name:
        type: str
        required: true
        description: Secret synced from OpenBao
      jenkins_java_opts:
        type: str
        required: true
        description: JAVA_OPTS
      jenkins_controller_resources:
        type: dict
        required: true
        description: Controller resources
      jenkins_reload_sidecar_resources:
        type: dict
        required: true
        description: Sidecar resources
      jenkins_init_resources:
        type: dict
        required: true
        description: Init container resources
      storage_class_name:
        type: str
        required: true
        description: StorageClass
      kubeconfig_path:
        type: str
        required: true
        description: admin kubeconfig path
