---
- name: Add Jenkins Helm repo
  ansible.builtin.command: helm repo add jenkins https://charts.jenkins.io
  changed_when: false

- name: Add NFS provisioner Helm repo
  ansible.builtin.command: helm repo add nfs-subdir-external-provisioner https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
  changed_when: false

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Create Jenkins namespace
  ansible.builtin.command: kubectl create namespace {{ jenkins.namespace }}
  register: ns
  failed_when: ns.rc != 0 and 'already exists' not in ns.stderr
  changed_when: ns.rc == 0

- name: Deploy NFS provisioner
  ansible.builtin.command: >
    helm upgrade --install nfs-provisioner nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
    --namespace {{ jenkins.namespace }}
    --set nfs.server={{ nfs.server }}
    --set nfs.path={{ nfs.path }}
    --set storageClass.name=nfs
    --set storageClass.defaultClass=true
    --set storageClass.mountOptions[0]=nfsvers=3
    --set storageClass.mountOptions[1]=nolock
    --set storageClass.mountOptions[2]=noatime
    --wait --timeout 60s
  changed_when: true

- name: Deploy Jenkins via Helm
  ansible.builtin.command: >
    helm upgrade --install jenkins jenkins/jenkins
    --namespace {{ jenkins.namespace }}
    --set controller.serviceType=NodePort
    --set controller.nodePort={{ jenkins.node_port | default(32000) }}
    --set controller.admin.username={{ jenkins.admin_user | default('admin') }}
    --set controller.admin.password={{ jenkins.admin_password }}
    --set persistence.enabled=true
    --set persistence.size={{ jenkins.storage | default('10Gi') }}
    --set persistence.storageClass=nfs
    --set controller.containerEnv[0].name=DOCKER_HOST
    --set controller.containerEnv[0].value=tcp://10.0.0.80:2375
    --set controller.podSecurityContextOverride.runAsUser=0
    --set controller.podSecurityContextOverride.runAsGroup=0
    --wait --timeout {{ jenkins.wait_timeout | default('300s') }}
  changed_when: true

- name: Get initial admin password
  ansible.builtin.command: >
    kubectl exec -n {{ jenkins.namespace }} svc/jenkins -c jenkins --
    /bin/sh -c 'cat /run/secrets/additional/chart-admin-password'
  register: jenkins_password
  changed_when: false
  ignore_errors: true

- name: Print Jenkins access info
  ansible.builtin.debug:
    msg:
      - "Jenkins URL : http://<node-ip>:{{ jenkins.node_port | default(32000) }}"
      - "Login       : {{ jenkins.admin_user | default('admin') }}"
      - "Password    : {{ jenkins_password.stdout | default('kubectl get secret -n ' + jenkins.namespace + ' jenkins -o jsonpath={.data.jenkins-admin-password} | base64 -d') }}"