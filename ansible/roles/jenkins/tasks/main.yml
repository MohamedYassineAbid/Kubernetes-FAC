---
- name: Add Jenkins Helm repo
  kubernetes.core.helm_repository:
    name: jenkins
    repo_url: https://charts.jenkins.io

- name: Create Jenkins namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ jenkins_namespace }}"
        labels:
          app: jenkins
          team: devops

# Admin credentials come from OpenBao (apps/jenkins), never from Ansible
- name: Sync Jenkins admin credentials from OpenBao
  ansible.builtin.include_role:
    name: external_secrets
    tasks_from: sync
  vars:
    es_name: "{{ jenkins_admin_secret_name }}"
    es_namespace: "{{ jenkins_namespace }}"
    es_path: apps/jenkins
    es_properties: { jenkins-admin-password: admin-password }
    es_static: { jenkins-admin-user: "{{ jenkins_admin_user }}" }

- name: Deploy Jenkins via Helm
  kubernetes.core.helm:
    name: jenkins
    chart_ref: jenkins/jenkins
    chart_version: "{{ jenkins_chart_version }}"
    release_namespace: "{{ jenkins_namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"
    update_repo_cache: true
    wait: true
    wait_timeout: "{{ jenkins_wait_timeout }}"
    values:
      persistence:
        enabled: true
        size: "{{ jenkins_storage_size }}"
        storageClass: "{{ storage_class_name }}"
      controller:
        serviceType: NodePort
        nodePort: "{{ jenkins_node_port }}"
        admin:
          createSecret: false
          existingSecret: "{{ jenkins_admin_secret_name }}"
          userKey: jenkins-admin-user
          passwordKey: jenkins-admin-password
        podSecurityContextOverride:
          runAsUser: 0
          runAsGroup: 0
        resources: "{{ jenkins_controller_resources }}"
        sidecars:
          configAutoReload:
            resources: "{{ jenkins_reload_sidecar_resources }}"
        initContainerResources: "{{ jenkins_init_resources }}"
        initContainerEnv:
          - name: JAVA_OPTS
            value: "{{ jenkins_java_opts }}"

- name: Print Jenkins access info
  ansible.builtin.debug:
    msg:
      - "Jenkins URL : http://{{ control_plane_ip }}:{{ jenkins_node_port }}"
      - "Login       : {{ jenkins_admin_user }}"
      - "Password    : stored in OpenBao at {{ openbao_kv_mount }}/apps/jenkins (admin-password)"
