---
- name: Ensure Python Docker library is installed
  apt:
    name: python3-docker
    state: present
    update_cache: yes

- name: Create directory on the NFS path for persistent data
  file:
    path: "{{ nexus_data_path }}"
    state: directory
    owner: "{{ nexus_uid }}"
    group: "{{ nexus_uid }}"
    mode: "0755"

- name: Deploy Nexus as a Docker container
  community.docker.docker_container:
    name: nexus
    image: "{{ nexus_image }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ nexus_http_port }}:8081"
      - "{{ nexus_registry_port }}:{{ nexus_registry_port }}"
    volumes:
      - "{{ nexus_data_path }}:/nexus-data"
