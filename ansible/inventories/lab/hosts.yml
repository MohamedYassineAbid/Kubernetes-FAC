---
# ─────────────────────────────────────────────────────────────
#  TOPOLOGY for the "lab" environment: nodes, IPs, VM sizes, optional VM presence.
#  - Ansible reads it as the inventory (ansible.cfg).
#  - The Vagrantfile parses it to create the VMs (KFAC_ENV selects the env).
#  Configuration lives in group_vars/all/*.yml next to this file;
#  every secret lives in OpenBao on the secrets VM (no secrets in git, no Ansible Vault).
# ─────────────────────────────────────────────────────────────
all:
  vars:
    cluster_name: "Kubernetes Cluster"   # VirtualBox group name
    vagrant_box: "ubuntu/jammy64"              # "-arm64" is appended on aarch64 hosts
    # These settings describe which optional VMs exist in this lab topology.
    # Role execution is selected by Ansible tags or Kuboos role templates.
    services_vm_enabled: false
    secrets_vm_enabled: false

    # Choose the backend before running the storage role.
    # longhorn   = replicated block storage across the workers (survives a node loss)
    # local-path = a folder on the node that runs the pod (lightest; data stays on that node)
    # nfs        = the services VM's NFS share (needs services_vm_enabled: true)
    storage_backend: local-path
    # Host-only network the VMs live on
    private_network_cidr: "192.168.56.0/24"

  children:
    # Connection settings for the Vagrant VMs only (localhost must not inherit them)
    vms:
      vars:
        ansible_user: vagrant
        ansible_python_interpreter: /usr/bin/python3
        # SSH straight to the private-network IP (no forwarded ports to track)
        ansible_host: "{{ internal_ip }}"
        ansible_ssh_private_key_file: "{{ inventory_dir }}/../../../.vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key"
      children:
        k8s_cluster:
          children:
            control_nodes:
              hosts:
                controlplane:
                  internal_ip: 192.168.56.10
                  vm_cpus: 3
                  vm_memory: 3072
                  vm_disk: 30GB        # needs VAGRANT_EXPERIMENTAL="disks"
            workers:
              hosts:
                node01:
                  internal_ip: 192.168.56.11
                  vm_cpus: 2
                  vm_memory: 3072
                  vm_disk: 30GB        # needs VAGRANT_EXPERIMENTAL="disks"
                node02:
                  internal_ip: 192.168.56.12
                  vm_cpus: 2
                  vm_memory: 3072
                  vm_disk: 30GB        # needs VAGRANT_EXPERIMENTAL="disks"

        # OpenBao runs outside the cluster it serves.
        secrets_nodes:
          hosts:
            secrets:
              internal_ip: 192.168.56.20
              vm_cpus: 1
              vm_memory: 1024
              vm_disk: 20GB        # needs VAGRANT_EXPERIMENTAL="disks"

        service_nodes:
          hosts:
            services:
              internal_ip: 192.168.56.80
              vm_cpus: 2
              vm_memory: 3072
              vm_disk: 40GB        # needs VAGRANT_EXPERIMENTAL="disks"
