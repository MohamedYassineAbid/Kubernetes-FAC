---
# ─────────────────────────────────────────────────────────────
#  Environment configuration shared by more than one role.
#  Rules:
#   - A value is defined ONCE. Anything else derives from it ("{{ ... }}").
#   - Role-local tunables (resources, replicas, sizes, ports) live in
#     roles/<role>/defaults/main.yml; override them here only if this env differs.
#   - Every role validates its inputs (roles/<role>/meta/argument_specs.yml).
#   - No secret values anywhere in git: OpenBao (on the secrets VM, outside the
#     cluster) generates and stores every secret. There is no Ansible Vault.
# ─────────────────────────────────────────────────────────────

# ── Derived from the inventory ───────────────────────────────
control_plane_host: "{{ groups['control_nodes'][0] }}"
control_plane_ip: "{{ hostvars[control_plane_host]['internal_ip'] }}"
services_host: "{{ groups['service_nodes'][0] }}"
services_ip: "{{ hostvars[services_host]['internal_ip'] }}"
secrets_host: "{{ groups['secrets_nodes'][0] }}"
secrets_ip: "{{ hostvars[secrets_host]['internal_ip'] }}"
kubeconfig_path: /etc/kubernetes/admin.conf

# ── Cluster networking ───────────────────────────────────────
dns_servers:
  - "8.8.8.8"
  - "1.1.1.1"
pod_cidr: "172.16.0.0/16"
service_cidr: "172.17.0.0/18"

# ── Namespaces (single definition; everything references these) ──
storage_namespace: nfs-provisioner
local_path_namespace: local-path-storage    # fixed by the upstream manifest
longhorn_namespace: longhorn-system
external_secrets_namespace: external-secrets
kyverno_namespace: kyverno
traefik_namespace: traefik
monitoring_namespace: monitoring
jenkins_namespace: jenkins
mysql_namespace: mysql
app_namespace: taskmanager

# ── Storage ──────────────────────────────────────────────────
# storage_backend (hosts.yml) picks longhorn, local-path or nfs; the StorageClass has the same name
storage_class_name: "{{ storage_backend }}"
nfs_server: "{{ services_ip }}"
nfs_path: /srv/nfs/k8s

# ── Ingress / hostnames ──────────────────────────────────────
traefik_ingress_class: traefik
traefik_dashboard_host: "traefik.fss"
prometheus_host: "prometheus.fss"
grafana_host: "grafana.fss"

# ── Service wiring derived from names above ──────────────────
prometheus_release: prometheus
prometheus_server_url: "http://{{ prometheus_release }}-server.{{ monitoring_namespace }}.svc.cluster.local"
# OpenBao runs on the secrets VM, served over TLS from a local CA
openbao_url: "https://{{ secrets_ip }}:8200"
openbao_pki_dir: "{{ playbook_dir }}/fetched/pki"          # CA + server cert (git-ignored)
openbao_local_dir: "{{ playbook_dir }}/fetched/openbao"    # break-glass + Ansible AppRole (git-ignored)
external_secrets_release: external-secrets
# ClusterSecretStore every ExternalSecret reads from
secret_store_name: openbao
# Contract between the openbao and external_secrets roles
openbao_kv_mount: kv
openbao_eso_role: external-secrets

# ── Application settings shared by producer and consumer roles ──
mysql_database: appdb
mysql_user: appuser
streamlit_mysql_secret_name: streamlit-mysql-secret
grafana_admin_user: admin
jenkins_admin_user: admin

# ── Secrets in OpenBao (generated by OpenBao on first run, never stored in git) ──
# path -> fields. apps/* reach pods through External Secrets (read-only);
# bootstrap/* are read by Ansible itself through its AppRole (read-only).
openbao_generated_secrets:
  - path: bootstrap/traefik
    fields: [dashboard-password]
  - path: bootstrap/harbor
    fields: [admin-password]
  - path: apps/mysql
    fields: [root-password, password]
  - path: apps/grafana
    fields: [admin-password]
  - path: apps/jenkins
    fields: [admin-password]

# ── Services VM (Nexus registry is consumed by the cluster nodes) ──
nexus_ip: "{{ services_ip }}"
nexus_registry_port: 5002

# ── Policy ───────────────────────────────────────────────────
kyverno_validation_failure_action: Enforce
# Built from the namespace variables above, so a rename can't silently drop an exclusion
kyverno_excluded_namespaces:
  - kube-system
  - "{{ kyverno_namespace }}"
  - "{{ traefik_namespace }}"
  - "{{ storage_namespace }}"
  - "{{ local_path_namespace }}"
  - "{{ longhorn_namespace }}"          # Longhorn needs privileged node agents
  - "{{ mysql_namespace }}"
kyverno_required_labels:
  - app
  - team
kyverno_policies:
  disallow_latest_tag: false
  require_labels: false
  require_resource_limits: false
  disallow_privileged: true
  disallow_default_namespace: true
  disallow_nfs_volumes: true   # inline nfs: volumes would expose the whole export
