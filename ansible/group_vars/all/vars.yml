---
#Network 
dns_servers:
  - "8.8.8.8"
  - "1.1.1.1"
pod_cidr: "172.16.1.0/16"
service_cidr: "172.17.1.0/18"
#kubernetes

kubernetes_version: "1.31.0-*"
kubernetes_version_short: "1.31"
calico_version: "3.26.0"
os_name: "ubuntu/jammy64"

#Longhorn
longhorn_namespace: longhorn-system
longhorn_replica_count: 1
longhorn_storage_reserved_percentage: 15
gitlab:
  ip: "10.0.0.80"
  http_port: 80
  registry_port: 5050        # container registry on its own port
  data_dir: /srv/gitlab
jenkins:
  namespace: jenkins
  node_port: 32000
  admin_user: admin
  admin_password: "{{ vault_jenkins_admin_password }}"

app_namespace: taskmanager
streamlit_mysql_secret_name: streamlit-mysql-secret
nfs:
  server: "10.0.0.80"   # your services node IP
  path: /srv/nfs/k8s

nexus:
  data_path: "{{ nfs.path }}/nexus"
  registry_port: "5002"
  ip: "{{ nfs.server }}"
  docker_user: "{{ vault_nexus_user }}"
  docker_password: "{{ vault_nexus_password }}"

gitea:
  data_path: "{{ nfs.path }}/gitea"
  
harbor_url: "{{ hostvars['services']['internal_ip'] }}"
harbor_user: "admin"
harbor_pass: "{{ vault_harbor_password }}"
harbor_version: "v2.14.2"
harbor_install_dir: "/opt/harbor"
harbor_hostname: "{{ hostvars['services']['internal_ip'] }}" 
harbor_admin_password: "{{ vault_harbor_admin_password }}"  
harbor_data_volume: "/data"
# Resource optimization
idle_timeout: "300"  
cull_every: "60"     
storage_class: "longhorn"
user_storage_size: "5Gi"

#keyverno 
kyverno_namespace: kyverno
kyverno_chart_version: "3.2.0"
kyverno_validation_failure_action: Enforce
kyverno_kubectl_image_tag: "1.28.15"


kyverno_excluded_namespaces:
  - kube-system
  - kyverno
  - cert-manager
  - traefik
  - longhorn-system
  - mysql

kyverno_required_labels:
  - app
  - team

kyverno_policies:
  disallow_latest_tag: false   # ← set to false
  require_labels: false
  require_resource_limits: false
  disallow_privileged: true
  disallow_default_namespace: true  


kubeconfig_path: "/etc/kubernetes/admin.conf"

# Traefik
role_enabled: true
traefik_namespace: traefik
traefik_service_name: traefik
traefik_ingress_class: traefik
traefik_image: traefik:v3.1.7
traefik_nodeport_http: 30090
traefik_nodeport_http_enabled: true
traefik_nodeport_https: 30490
traefik_nodeport_https_enabled: true
traefik_dashboard_enabled: true
traefik_dashboard_host: "traefik.fss"
traefik_dashboard_path: /
traefik_trusted_ips: []
traefik_servers_transport_insecure_skip_verify: true

# Monitoring
prometheus_host: "prometheus.fss"
grafana_host: "grafana.fss"
grafana_admin_user: "admin"
grafana_admin_password: "{{ vault_grafana_admin_password }}"

# MySQL
mysql:
  namespace: mysql
  root_password: "{{ vault_mysql_root_password }}"
  database: "appdb"
  user: "appuser"
  password: "{{ vault_mysql_app_password }}"
  storage_size: "5Gi"
  storage_class: "nfs"
  image: "mysql:8.0.36"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"